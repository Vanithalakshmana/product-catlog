<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Product Catalog with Filters</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#3b82f6;
    --radius:12px;
    --shadow: 0 6px 18px rgba(16,24,40,0.06);
    --gap:18px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:#0f172a;
    padding:28px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .wrap{
    max-width:1200px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 280px 1fr;
    gap:var(--gap);
    align-items:start;
  }

  /* Sidebar */
  .sidebar{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    position:sticky;
    top:28px;
    height:fit-content;
  }
  .brand{
    font-weight:700;
    font-size:18px;
    margin-bottom:10px;
  }
  .section{margin-bottom:16px}
  label.section-title{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#0f172a;
    font-size:14px;
  }
  .checkbox-list{display:flex;flex-direction:column;gap:8px}
  .checkbox-list label{font-weight:500; color:var(--muted); font-size:14px; display:flex; gap:8px; align-items:center}
  .slider-row{display:flex; gap:10px; align-items:center; margin-top:8px}
  .range-values{font-size:13px; color:var(--muted)}
  input[type="range"]{width:100%}

  /* Top controls */
  .top-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .search{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--card);
    padding:8px;
    border-radius:10px;
    box-shadow:var(--shadow);
    width:100%;
  }
  .search input{
    border:0; outline:0; font-size:14px; width:100%;
    background:transparent;
  }
  .controls-right{display:flex; gap:8px; align-items:center}
  select, button{
    padding:8px 12px;
    border-radius:10px;
    border:1px solid #e6e9f2;
    background:white;
    font-size:14px;
  }
  button.primary{
    background:var(--accent);
    color:white;
    border:0;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(59,130,246,0.12);
  }
  button.ghost{background:transparent; border:1px dashed #e6e9f2; color:var(--muted);}

  /* Products grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:16px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:14px;
    box-shadow:var(--shadow);
    display:flex;
    gap:12px;
    align-items:flex-start;
    min-height:120px;
  }
  .thumb{
    width:120px;
    height:90px;
    border-radius:10px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#eef2ff,#fff);
    overflow:hidden;
  }
  .thumb img{max-width:100%; max-height:100%; display:block}
  .meta{flex:1; display:flex; flex-direction:column; gap:6px}
  .title{font-weight:700; font-size:15px}
  .cat{font-size:13px; color:var(--muted)}
  .price-row{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
  .price{font-weight:800; color:#0b1223}
  .rating{font-weight:600; font-size:13px; color:#10b981}

  /* Empty message */
  .empty{
    padding:28px;
    text-align:center;
    color:var(--muted);
    background:linear-gradient(180deg,#fff,#fbfdff);
    border-radius:12px;
    box-shadow:var(--shadow);
  }

  /* Responsive */
  @media(max-width:980px){
    .wrap{grid-template-columns: 1fr; padding:18px}
    .sidebar{position:relative; top:0; order:2}
    .grid{grid-template-columns: repeat(2, 1fr)}
  }
  @media(max-width:560px){
    .grid{grid-template-columns: 1fr}
    .thumb{width:96px; height:72px}
    .top-controls{flex-direction:column; gap:8px; align-items:stretch}
    .controls-right{justify-content:space-between}
  }
  /* small utilities */
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .tag{background:#eef2ff;color:#1e40af;padding:6px 8px;border-radius:999px;font-weight:700;font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <!-- Sidebar Filters -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">Product Catalog</div>

      <div class="section">
        <label class="section-title">Search</label>
        <div style="display:flex; gap:8px;">
          <input id="s-search" type="text" placeholder="Search products..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #e6e9f2">
          <button id="clearSearch" class="ghost">Clear</button>
        </div>
      </div>

      <div class="section" id="categorySection">
        <label class="section-title">Category</label>
        <div class="checkbox-list" id="categories"></div>
      </div>

      <div class="section">
        <label class="section-title">Price (max)</label>
        <div class="slider-row">
          <input type="range" id="priceRange" min="0" max="1000" step="1" value="1000">
        </div>
        <div class="range-values small muted" style="margin-top:8px">
          Showing up to ₹<span id="priceValue">1000</span>
        </div>
      </div>

      <div class="section">
        <label class="section-title">Minimum Rating</label>
        <select id="ratingSelect" style="width:100%">
          <option value="0">Any rating</option>
          <option value="1">1 ★ & up</option>
          <option value="2">2 ★ & up</option>
          <option value="3">3 ★ & up</option>
          <option value="4">4 ★ & up</option>
          <option value="5">5 ★</option>
        </select>
      </div>

      <div style="display:flex; gap:8px; margin-top:12px">
        <button id="applyBtn" class="primary" style="flex:1">Apply</button>
        <button id="clearBtn" class="ghost" style="flex:1">Clear filters</button>
      </div>
    </aside>

    <!-- Main -->
    <main>
      <div class="top-controls">
        <div class="search" style="max-width:720px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path d="M21 21l-4.35-4.35" stroke="#9aa4c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11" cy="11" r="6" stroke="#9aa4c0" stroke-width="2" />
          </svg>
          <input id="topSearch" placeholder="Search products by name..." />
        </div>

        <div class="controls-right">
          <select id="sortBy">
            <option value="relevance">Sort: Relevance</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="rating-desc">Rating: High → Low</option>
            <option value="newest">Newest</option>
          </select>
          <div class="small muted" id="resultCount">0 items</div>
        </div>
      </div>

      <div id="productArea">
        <div class="grid" id="grid"></div>
        <div id="empty" class="empty" style="display:none; margin-top:16px;">
          No products match your filters. Try changing filters or clearing them.
        </div>
      </div>
    </main>
  </div>

<script>
/* ====== SAMPLE PRODUCTS ======
   Each product: id, name, category, price, rating (1-5), imageSvg (inline SVG string), createdAt (ISO)
*/
const PRODUCTS = [
  {id:1, name:"Aurora Wireless Headphones", category:"Electronics", price:3499, rating:4.5, createdAt:"2025-09-05"},
  {id:2, name:"Crimson Running Shoes", category:"Footwear", price:2599, rating:4.2, createdAt:"2025-07-20"},
  {id:3, name:"Maple Wooden Desk", category:"Furniture", price:12999, rating:4.8, createdAt:"2024-12-10"},
  {id:4, name:"Luna Ceramic Mug - Set of 2", category:"Home", price:499, rating:4.1, createdAt:"2025-02-15"},
  {id:5, name:"Nebula Smartwatch Series 3", category:"Electronics", price:8999, rating:4.6, createdAt:"2025-08-01"},
  {id:6, name:"Terra Backpack 20L", category:"Accessories", price:1799, rating:4.0, createdAt:"2025-03-12"},
  {id:7, name:"Cascade Floor Lamp", category:"Home", price:3499, rating:3.9, createdAt:"2024-11-05"},
  {id:8, name:"Vantage Formal Shirt", category:"Clothing", price:1199, rating:4.3, createdAt:"2025-06-30"},
  {id:9, name:"Orbit Drone Mini", category:"Electronics", price:15999, rating:4.7, createdAt:"2025-04-25"},
  {id:10, name:"Nimbus Pillow (Pair)", category:"Home", price:999, rating:4.4, createdAt:"2025-01-02"},
  {id:11, name:"Summit Hiking Poles", category:"Sports", price:1499, rating:4.0, createdAt:"2025-05-11"},
  {id:12, name:"Helix Sunglasses", category:"Accessories", price:799, rating:3.8, createdAt:"2025-08-21"},
  {id:13, name:"Prism Graphic Tee", category:"Clothing", price:699, rating:4.2, createdAt:"2025-09-11"},
  {id:14, name:"Aero Bike Helmet", category:"Sports", price:1299, rating:4.5, createdAt:"2024-09-30"},
  {id:15, name:"Echo Bluetooth Speaker", category:"Electronics", price:2499, rating:4.1, createdAt:"2025-07-01"},
];

/* Helper: generate simple inline SVG thumbnail by category initial */
function svgThumb(text){
  const bg = ["#eef2ff","#fff7ed","#f0fdf4","#fff1f2","#f8fafc","#fff7f0"][Math.floor(Math.random()*6)];
  const fill="#0f172a";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='140' viewBox='0 0 200 140'>
    <rect width='200' height='140' rx='12' fill='${bg}' />
    <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='Inter, Arial' font-size='26' fill='${fill}'>${escapeHtml(text)}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* State */
let state = {
  search: '',
  category: new Set(),
  maxPrice: 0,
  minRating: 0,
  sortBy: 'relevance',
  topSearch: ''
};

/* DOM refs */
const grid = document.getElementById('grid');
const categoriesDiv = document.getElementById('categories');
const priceRange = document.getElementById('priceRange');
const priceValue = document.getElementById('priceValue');
const ratingSelect = document.getElementById('ratingSelect');
const clearBtn = document.getElementById('clearBtn');
const applyBtn = document.getElementById('applyBtn');
const sortBy = document.getElementById('sortBy');
const resultCount = document.getElementById('resultCount');
const empty = document.getElementById('empty');
const sSearch = document.getElementById('s-search');
const topSearch = document.getElementById('topSearch');
const clearSearch = document.getElementById('clearSearch');

/* Initialize UI values from products */
function init(){
  // compute price range
  const prices = PRODUCTS.map(p => p.price);
  const max = Math.ceil(Math.max(...prices) / 100) * 100; // round up
  priceRange.max = Math.max(max, 1000);
  priceRange.value = priceRange.max;
  priceValue.textContent = priceRange.value;
  state.maxPrice = Number(priceRange.value);

  // categories
  const cats = Array.from(new Set(PRODUCTS.map(p => p.category))).sort();
  for(const c of cats){
    const id = 'cat-' + c.replace(/\s+/g,'-').toLowerCase();
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" id="${id}" value="${c}"> <span>${c}</span>`;
    categoriesDiv.appendChild(label);
    label.querySelector('input').addEventListener('change', (e)=>{
      if(e.target.checked) state.category.add(e.target.value);
      else state.category.delete(e.target.value);
      // live update (optional)
      // applyFilters();
    });
  }

  // create thumbnail images in products for display
  for(const p of PRODUCTS){
    p.thumbnail = svgThumb(p.name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase());
  }

  // wire events
  priceRange.addEventListener('input', ()=>{
    priceValue.textContent = priceRange.value;
    state.maxPrice = Number(priceRange.value);
  });
  ratingSelect.addEventListener('change', ()=> state.minRating = Number(ratingSelect.value));
  sortBy.addEventListener('change', ()=> { state.sortBy = sortBy.value; applyFilters(); });
  sSearch.addEventListener('input', debounce(()=> { state.search = sSearch.value.trim(); applyFilters(); }, 250));
  topSearch.addEventListener('input', debounce(()=> { state.topSearch = topSearch.value.trim(); applyFilters(); }, 250));
  clearBtn.addEventListener('click', clearFilters);
  applyBtn.addEventListener('click', applyFilters);
  clearSearch.addEventListener('click', ()=> { sSearch.value=''; state.search=''; applyFilters(); });

  // initial render
  applyFilters();
}

/* Main filter & render function */
function applyFilters(){
  // Start with all products
  let out = PRODUCTS.slice();

  // Top search and sidebar search combined - both must match (if provided)
  const s1 = state.topSearch.toLowerCase();
  const s2 = state.search.toLowerCase();
  if(s1) out = out.filter(p => p.name.toLowerCase().includes(s1));
  if(s2) out = out.filter(p => p.name.toLowerCase().includes(s2));

  // categories
  if(state.category.size > 0){
    out = out.filter(p => state.category.has(p.category));
  }

  // price
  if(state.maxPrice !== undefined && state.maxPrice !== null){
    out = out.filter(p => p.price <= state.maxPrice);
  }

  // rating
  if(state.minRating > 0){
    out = out.filter(p => Math.floor(p.rating) >= state.minRating || p.rating >= state.minRating);
  }

  // sort
  switch(state.sortBy){
    case 'price-asc': out.sort((a,b)=>a.price-b.price); break;
    case 'price-desc': out.sort((a,b)=>b.price-a.price); break;
    case 'rating-desc': out.sort((a,b)=>b.rating-a.rating); break;
    case 'newest': out.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)); break;
    default: /* relevance: keep original order */ break;
  }

  renderProducts(out);
}

/* Render grid */
function renderProducts(list){
  grid.innerHTML = '';
  resultCount.textContent = `${list.length} item${list.length!==1?'s':''}`;
  if(list.length === 0){
    empty.style.display = 'block';
    return;
  } else empty.style.display = 'none';

  for(const p of list){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><img alt="${escapeHtml(p.name)}" src="${p.thumbnail}"></div>
      <div class="meta">
        <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start">
          <div style="min-width:0">
            <div class="title">${escapeHtml(p.name)}</div>
            <div class="cat small muted">${escapeHtml(p.category)}</div>
          </div>
          <div style="text-align:right">
            <div class="tag small">₹${numberWithCommas(p.price)}</div>
          </div>
        </div>
        <div class="price-row">
          <div class="rating">★ ${p.rating.toFixed(1)}</div>
          <div class="small muted">Added: ${new Date(p.createdAt).toLocaleDateString()}</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  }
}

/* Utilities */
function numberWithCommas(x){ return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function debounce(fn, wait=200){
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), wait); };
}

/* Clear filters */
function clearFilters(){
  // reset state
  state = { search: '', category: new Set(), maxPrice: Number(priceRange.max), minRating: 0, sortBy: 'relevance', topSearch: '' };
  // reset UI
  sSearch.value=''; topSearch.value=''; priceRange.value = priceRange.max; priceValue.textContent = priceRange.value;
  ratingSelect.value='0';
  sortBy.value='relevance';
  // uncheck categories
  categoriesDiv.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  applyFilters();
}

/* small helper to populate createdAt if missing (not used here) */
(function prepareInitialState(){
  // ensure max price default
  state.maxPrice = Number(priceRange ? priceRange.value : 1000);
})();

/* Kick off init after DOM loaded */
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
